:root{--blue:#0864a8;--deep:#0b3357;--cyan:#1596b5;--line:#dce8f1;--bg:#f3f8fc;--ink:#1b3650;--muted:#6a8195}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1580px;margin:auto;padding:22px 30px 50px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:2px;font-size:11px}.head h1{margin:5px 0;font-size:25px;color:var(--deep)}.sub{color:var(--muted);font-size:12px}.tag{background:#e7f3fa;color:#0c649a;border:1px solid #c5e2f0;border-radius:20px;padding:7px 12px;font-size:12px}.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.scene{border:1px solid var(--line);background:white;border-radius:13px;text-align:left;padding:17px;display:flex;gap:12px;align-items:center;transition:.15s}.scene.active{border:2px solid var(--blue);background:#edf7ff;box-shadow:0 4px 15px #0b60901a}.scene .ico{font-size:27px}.scene strong{display:block;font-size:15px}.scene small{display:block;color:var(--muted);margin-top:5px}.panel{margin-top:16px;background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 5px 24px #194f7210}.toolbar{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:6px;background:#eff5f9;padding:4px;border-radius:9px}.tab{border:0;background:transparent;color:#587287;padding:9px 16px;border-radius:7px}.tab.active{background:var(--blue);color:white;font-weight:700}.actions{display:flex;align-items:center;gap:8px}.outline{background:white;border:1px solid #cbdce8;color:var(--blue);border-radius:8px;padding:9px 12px}.body{padding:22px}.phase{border:1px solid var(--line);border-radius:12px;background:#fff;min-width:225px;overflow:hidden}.phase h3{background:#eaf4f ont-size:11px;color:#7b91a3}@media(max-width:850px){.scenes{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.flow{flex-direction:column}.phase{min-width:0}.head{align-items:flex-start}.week{grid-template-columns:1fr}}
:root{--blue:#0b9bc4;--deep:#e3f6ff;--cyan:#51d7ef;--line:#20465c;--bg:#061725;--ink:#d7eefa;--muted:#8cb1c5}

</style></head><body><div class="wrap"><div class="head"><div><div class="eyebrow">SHIPBUILDING & OFFSHORE ENGINEERING / EXECUTION</div><h1>物流执行标准与质量保障</h1></div></div><div class="scenes" id="scenes"></div><div class="panel"><div class="toolbar"><div class="tabs" id="tabs"></div><div class="actions"><button class="outline" onclick="downloadList()">导出标准清单</button><button class="outline" onclick="showWeekly()">质量管理</button></div></div><div class="body" id="content"></div></div></div></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><button class="close" onclick="closeModal()">关闭 ×</button><div id="modalContent"></div></div></div><script>
const SCENES={"海运集装箱": [["计划与协同", "接收采购及发货需求", "核对物料与件毛体", "运输方案及订舱确认", "发货计划下推运单"], ["起运前操作", "ISCP接单与补料", "提单与箱号关联", "供应商交货确认", "起运港作业与放行"], ["干线与中转", "实际离港与船期跟踪", "海运在途轨迹", "中转节点跟踪", "预计到港更新"], ["目的港作业", "进口清关资料收集", "报关确认与海关放行", "目的港提货安排", "国内车队配送"], ["交付与闭环", "到厂交付签收", "签收单归档", "报关数据关联回传", "异常闭环与复盘"]], "海运大件散杂货": [["需求与方案", "确认设备规格及重量", "收集箱单及装卸图纸", "运输路径与船型评估", "三方确认发运方案"], ["起运与装船", "大件提货与内陆转运", "码头堆存与吊装准备", "吊装与绑扎加固", "装船确认及单证"], ["海上运输", "实际开航确认", "航程及天气风险跟踪", "中转或转驳管理", "预计到港更新"], ["到港与卸货", "进口清关及放行", "卸船与设备验收", "超限运输车辆安排", "目的地配送"], ["交付与复盘", "现场卸货与签收", "损伤异常处理", "运输单证归档", "项目经验复盘"]], "国际空运": [["需求与计划", "紧急物料需求核实", "货物尺寸重量核对", "航班与舱位方案", "运单委托创建"], ["始发地操作", "供应商交货确认", "空运安检与交运", "出口报关及放行", "航空运单确认"], ["航空干线", "航班起飞跟踪", "中转航班跟踪", "预计到港更新", "实际到港确认"], ["目的港操作", "进口清关资料准备", "清关与放行", "机场提货", "国内配送"], ["交付闭环", "送达指定仓库", "签收凭证回收", "时效复核", "异常关闭"]], "公路运输": [["委托与调度", "接收发货需求", "核对装载参数", "车辆与线路安排", "确认提货时间"], ["提货与装载", "车辆到场", "货物核对与装载", "绑扎加固检查", "发车确认"], ["在途运输", "车辆定位跟踪", "预计到达更新", "运输异常处置", "跨境手续（如适用）"], ["到厂交付", "到厂预约", "卸货与数量核验", "签收确认", "回单上传"], ["履约闭环", "交付状态回传", "异常结案", "凭证归档", "履约复盘"]]};const STANDARDS={"接收采购及发货需求": ["核对项目、采购订单、物料、计划要求到货日期及贸易条款", "招商船舶采购工程师 / 外运物流专员", "项目、合同、采购订单、发货需求", "需求确认记录", "《供应链协同平台操作手册》§8—10"], "核对物料与件毛体": ["确认提货地址、包装单位、长宽高、单件重量、数量、总体积和总重量；单位口径一致", "外运物流专员", "箱单、图纸、发货计划", "完整货物信息", "《供应链协同平台操作手册》§9.2"], "运输方案及订舱确认": ["根据完货日期、要求到货日期及运输方式确认方案；与招商船舶、供应商及物流方核对", "外运物流专员 / 承运商", "箱单、图纸、FAT计划（如适用）", "运输方案与订舱确认", "《供应链协同平台操作手册》§9.3—9.4"], "发货计划下推运单": ["核对提货地址、件毛体、承运商及服务要求；创建运单并核验外运业务号", "外运物流专员", "发货计划、订舱信息", "SCCM运单 / 外运业务号", "《供应链协同平台操作手册》§10"], "ISCP接单与补料": ["补齐提单号、收发货人、通知人、箱型箱号及件毛体；确认ISCP订单", "外运客服", "SCCM运单、MBL、箱单", "ISCP订单确认记录", "《供应链协同平台操作手册》§11.1"], "供应商交货确认": ["按合同交付地点核对交货结果，记录实际提货时间并留痕", "海外代理 / 外运物流专员 / 采购工程师", "交货通知、交接资料", "交货确认记录", "《供应链协同平台操作手册》§11.2"], "实际离港与船期跟踪": ["关注ETD/ATD、ETA/ATA、船名航次、提单号与异常事件", "外运物流专员 / 控制塔", "提单号、船名航次", "物流节点状态", "《供应链协同平台操作手册》§11.3"], "进口清关资料收集": ["海运通常提前5天、空运通常提前2天准备进口清关资料；具体以实际要求为准", "外运客服 / 关务经理", "发票、箱单及适用报关资料", "清关资料包", "《供应链协同平台操作手册》§11.4"], "报关确认与海关放行": ["审核清关资料并制作报关单，经采购部关务经理确认，跟踪放行状态", "外运客服 / 关务经理", "报关资料、报关单", "放行状态", "《供应链协同平台操作手册》§11.4"], "到厂交付签收": ["发送送货计划并取得签收凭证；签收时间按现行业务规则记录", "外运物流专员 / 车队", "SINO号、提单号、车牌号、件毛体", "签收单及交付状态", "《供应链协同平台操作手册》§11.5"], "异常闭环与复盘": ["记录、通知、处置、验证、关闭；留存异常证据", "责任业务人员 / 客服主管", "异常记录、处理方案", "关闭记录与复盘", "《供应链协同平台操作手册》§13.4"]};const SPECIFIC={"海运大件散杂货": ["核对设备长宽高、重心、吊点、超限条件及装卸图纸；组织船舶、码头、车辆与吊装方案评估", "大件物流项目经理 / 现场操作", "设备图纸、吊装资料、包装资料", "经确认的专项运输方案"], "国际空运": ["确认货物适航性、包装、安检及航班时效；核对航空运单和交接凭证", "空运客服 / 航空代理", "箱单、申报资料、航班确认", "航空运单及状态记录"], "公路运输": ["确认提货地址、货物件毛体、车型与装载要求；核对到厂预约及签收凭证", "调度 / 司机 / 收货方", "派车单、装箱单、预约信息", "提送货及签收记录"]};
let scene='海运集装箱',tab='执行流程图';const names=Object.keys(SCENES);const ico=['🚢','⚓','✈️','🚛'];const subtitles=['整箱 / 拼箱 · 进口交付','重大件 / 件杂船 · 专项运输','紧急设备 / 备件 · 空运交付','普通汽运 / 大件公路运输'];const tabs=['执行流程图','标准清单','运营监控'];
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function allNodes(){return SCENES[scene].flatMap(p=>p.slice(1))}function getStandard(n){if(STANDARDS[n])return [...STANDARDS[n],'已依据操作手册提取'];let a=SPECIFIC[scene];if(a)return [a[0]+'；当前节点：'+n,a[1],a[2],a[3],'专项作业标准','待确认'];return ['按运输委托要求执行“'+n+'”，核对业务数据、节点状态与留痕资料；具体细则待业务确认','外运业务操作 / 物流承运商','运输委托及相关单证','节点完成记录','通用作业标准','待确认']}
function openNode(n){const a=getStandard(n);document.getElementById('modalContent').innerHTML='<h2>'+esc(n)+'</h2><p class="sub">'+esc(scene)+' · 节点操作标准</p><div class="detailgrid">'+[['操作要求',a[0]],['责任角色',a[1]],['输入资料',a[2]],['输出/完成标准',a[3]],['标准依据',a[4]],['确认状态',a[5]],['监控建议','检查节点状态、时效、单证完整性及异常处理闭环；监控规则需接入实际数据后确认']].map(v=>'<div>'+esc(v[0])+'</div><div>'+esc(v[1])+'</div>').join('')+'</div>';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function render(){document.getElementById('scenes').innerHTML=names.map((n,i)=>'<button class="scene '+(n===scene?'active':'')+'" onclick="scene=names['+i+'];render()"><span class="ico">'+ico[i]+'</span><span><strong>'+n+'</strong><small>'+subtitles[i]+'</small></span></button>').join('');document.getElementById('tabs').innerHTML=tabs.map((t,i)=>'<button class="tab '+(t===tab?'active':'')+'" onclick="tab=tabs['+i+'];render()">'+t+'</button>').join('');let c=document.getElementById('content');if(tab==='执行流程图'){c.innerHTML='<p class="hint"></p><div class="flow">'+SCENES[scene].map((p,i)=>'<section class="phase"><h3><small>0'+(i+1)+'</small> · '+esc(p[0])+'</h3>'+p.slice(1).map((n,j)=>'<button class="node" onclick="openNode('+JSON.stringify(n).replace(/"/g,'&quot;')+')"><b>'+esc(n)+'</b><div class="meta"><span class="pill">查看标准</span><span>节点 '+(j+1)+'</span></div></button>').join('')+'</section>').join('')+'</div>'}else if(tab==='标准清单'){c.innerHTML='<p class="hint"></p><table class="table"><thead><tr><th>阶段</th><th>操作节点</th><th>核心要求</th><th>来源/状态</th><th>详情</th></tr></thead><tbody>'+SCENES[scene].map(p=>p.slice(1).map(n=>{let a=getStandard(n);return '<tr><td>'+esc(p[0])+'</td><td><b>'+esc(n)+'</b></td><td>'+esc(a[0].slice(0,95))+'</td><td><span class="status">'+esc(a[5])+'</span></td><td><a class="click" onclick="openNode('+JSON.stringify(n).replace(/"/g,'&quot;')+')">查看</a></td></tr>'}).join('')).join('')+'</tbody></table>'}else{const nodes=allNodes();c.innerHTML='<div class="metrics"><div class="metric"><small>执行流程节点</small><b>'+nodes.length+'</b></div><div class="metric"><small>待办任务</small><b>—</b></div><div class="metric"><small>异常事件</small><b>—</b></div><div class="metric"><small>风险预警</small><b>—</b></div></div><table class="table"><thead><tr><th>阶段</th><th>流程节点</th><th>待办</th><th>异常</th><th>风险</th><th>监控规则</th></tr></thead><tbody>'+SCENES[scene].map(p=>p.slice(1).map(n=>'<tr><td>'+esc(p[0])+'</td><td>'+esc(n)+'</td><td>—</td><td>—</td><td>—</td><td><a class="click" onclick="openNode('+JSON.stringify(n).replace(/"/g,'&quot;')+')">查看标准</a></td></tr>').join('')).join('')+'</tbody></table>'}}

function showWeekly(){document.getElementById('modalContent').innerHTML='<h2>质量管理 · '+esc(scene)+'</h2><p class="sub">质量检查与异常治理</p><div class="week"><div><small>重点跟踪</small><h2>运输节点履约</h2><p class="small">船期、到港、交付及时性</p></div><div><small>重点检查</small><h2>关键单证齐备</h2><p class="small">运单、报关、签收凭证</p></div><div><small>重点治理</small><h2>异常处理闭环</h2><p class="small">记录、通知、处置、验证、关闭</p></div></div><p>本周重点：复核临近交付的重点物料、待更新节点、未关闭异常与跨系统状态一致性。</p>';document.getElementById('modal').classList.add('show')}
function downloadList(){let lines=[['运输场景','阶段','节点','操作要求','责任角色','输入资料','输出结果','来源','确认状态']];SCENES[scene].forEach(p=>p.slice(1).forEach(n=>lines.push([scene,p[0],n,...getStandard(n)])));let csv='﻿'+lines.map(a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=scene+'_SOP标准清单.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
