<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国外运 · 船舶海工行业解决方案中心</title><style>
:root{--line:#20465c;--text:#d8f4ff;--muted:#9cc2d5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(1100px 550px at 50% 0,#0b2e4b,#030c15 65%);font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--text)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:linear-gradient(#55caff 1px,transparent 1px),linear-gradient(90deg,#55caff 1px,transparent 1px);background-size:38px 38px}
header{height:74px;position:sticky;top:0;z-index:10;background:#061826ed;border-bottom:1px solid #22516b;display:flex;align-items:center;justify-content:space-between;padding:0 max(26px,calc((100vw - 1660px)/2));backdrop-filter:blur(15px)}
.brand{display:flex;align-items:center;gap:17px}.brand-logo{font-size:19px;font-weight:900;color:#69dbff;border-right:1px solid #2d5b73;padding-right:18px}.brand-name{font-size:21px;font-weight:800;letter-spacing:.5px}nav{display:flex;gap:12px}nav a{color:#a7ccdc;text-decoration:none;padding:12px 17px;border-radius:9px;font-size:14px}nav a:hover{color:#fff;background:#12405c}
main{max-width:1660px;margin:auto;padding:18px 22px 40px}.module{margin-bottom:20px;scroll-margin-top:85px}.module-head{display:flex;align-items:center;gap:13px;padding:13px 2px}.module-head:before{content:"";width:4px;height:24px;border-radius:4px;background:#52d9ff;box-shadow:0 0 14px #00c8ff55}.module-head h2{font-size:21px;margin:0;letter-spacing:.4px}.module-head:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#2e6b86,transparent)}
.frame{display:block;width:100%;border:0;background:transparent;overflow:hidden}.section-divider{height:1px;background:linear-gradient(90deg,transparent,#26718b,transparent);margin:20px 0}
@media(max-width:900px){header{padding:0 12px}.brand-logo{font-size:15px}.brand-name{font-size:15px}nav a{padding:7px;font-size:12px}main{padding:10px}.module-head h2{font-size:17px}}

header{height:104px;position:sticky;display:grid;grid-template-columns:1fr auto 1fr;padding:0 36px;background:linear-gradient(90deg,#061728f8,#0c2b42f7 50%,#061728f8);border-bottom:1px solid #28627d}
.brand{grid-column:2;justify-content:center;flex-direction:column;gap:5px}.brand-logo{border:0;padding:0;font-size:13px;letter-spacing:6px;color:#8fcce7;font-weight:700}.brand-name{font-size:30px;letter-spacing:3px;text-shadow:0 0 28px #5cd6ff44;color:#f2fbff;white-space:nowrap}
nav{grid-column:3;justify-self:end;align-self:center;gap:9px}nav a{border:1px solid #24536d;background:#092437;color:#9dbfd1;min-width:130px;text-align:center;font-size:14px;font-weight:700;transition:.2s}nav a.active{border-color:#61dfff;background:linear-gradient(135deg,#0c6f9a,#0a405f);color:#fff;box-shadow:0 0 20px #18c6f433}nav a:hover{color:#fff;border-color:#55d4f6}
.module-head h2{font-size:23px}.module-head:before{height:26px;background:#68dcf8}.section-divider{margin:26px 0}
@media(max-width:1100px){header{display:flex;flex-direction:column;gap:10px;height:auto;padding:15px}.brand-name{font-size:22px}nav{justify-self:center}.module-head h2{font-size:19px}}
</style></head><body><header><div class="brand"><div class="brand-logo">中国外运</div><div class="brand-name">船舶海工行业解决方案中心</div></div><nav><a href="#supply">产业链全景</a><a href="#sop">物流执行标准</a></nav></header><main><section class="module" id="supply"><div class="module-head"><h2>船舶产业链全景</h2></div><iframe id="supplyFrame" class="frame" title="船舶产业链全景" src="船舶供应链全景.html" style="height:1120px" scrolling="no"></iframe></section><div class="section-divider"></div><section class="module" id="sop"><div class="module-head"><h2>物流执行标准与质量保障</h2></div><iframe id="sopFrame" class="frame" title="物流执行标准与质量保障" src="招商船舶_SOP执行标准.html" style="height:1240px" scrolling="no"></iframe></section></main><script>
function fitFrame(frame){try{let doc=frame.contentDocument;if(!doc)return;let h=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);frame.style.height=(h+8)+'px'}catch(e){}}
const links=[...document.querySelectorAll('nav a')];function updateActive(){const sop=document.getElementById('sop');const active=sop.getBoundingClientRect().top<window.innerHeight*.45?'#sop':'#supply';links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')===active));}window.addEventListener('scroll',updateActive,{passive:true});links.forEach(a=>a.addEventListener('click',()=>{links.forEach(b=>b.classList.toggle('active',b===a))}));updateActive();
for(let id of ['supplyFrame','sopFrame']){let f=document.getElementById(id);f.addEventListener('load',()=>{fitFrame(f);try{new ResizeObserver(()=>fitFrame(f)).observe(f.contentDocument.body)}catch(e){}})}
</script></body></html>
